<!-- IF:ci -->
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # NOTE: replace with the setup step for the project's language
      - name: Install dependencies
        run: {{cmd_install}}
      - name: Lint
        run: {{cmd_lint}}

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # NOTE: replace with the setup step for the project's language
      - name: Install dependencies
        run: {{cmd_install}}
      - name: Test
        run: {{cmd_test}}
<!-- ENDIF -->
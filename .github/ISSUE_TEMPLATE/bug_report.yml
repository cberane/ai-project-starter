name: Bug report
description: The installer or the skill does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here** — use the private channel described in [SECURITY.md](../blob/main/SECURITY.md).
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - npx (unpinned, from main)
        - npx with a pinned tag (e.g. #v0.2.0)
        - Manual clone (bin/ai-project-starter.js)
        - install.sh (no Node)
        - --user (user-level install)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node bin/ai-project-starter.js --version`, or the contents of `references/VERSION` inside the installed skill.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node --version`), and harness (Claude Code, vibe, or both).
      placeholder: Ubuntu 24.04, Node 20.11.0, Claude Code
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, including the target directory layout before the run.
      placeholder: |
        1. mkdir -p demo/.claude
        2. node bin/ai-project-starter.js demo < /dev/null
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: The full installer output, including the per-harness lines. Wrap it in a code block.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight checks
      options:
        - label: I can reproduce it on the latest release (or main).
          required: true
        - label: I re-ran the installer to confirm it is not a one-off (a rerun should be a no-op).
          required: false